<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>麦克风测试</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>麦克风测试</h1>
    <p>URL: <span id="url"></span></p>
    <p>协议: <span id="protocol"></span></p>

    <button onclick="testMic()">测试麦克风</button>

    <div id="result"></div>

    <script>
        document.getElementById('url').textContent = window.location.href;
        document.getElementById('protocol').textContent = window.location.protocol;

        async function testMic() {
            const result = document.getElementById('result');

            // 检查 API 支持
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                result.innerHTML = '<div class="status error">❌ 浏览器不支持麦克风 API (navigator.mediaDevices 未定义)</div>';
                return;
            }

            result.innerHTML = '<div class="status">⏳ 请求麦克风权限...</div>';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                result.innerHTML = '<div class="status success">✅ 麦克风访问成功！浏览器允许在此 URL 上使用麦克风。</div>';

                // 停止流
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                result.innerHTML = `<div class="status error">❌ 麦克风访问失败: ${err.name} - ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
