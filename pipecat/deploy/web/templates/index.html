<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #dc2626;
        }

        .status.connected {
            background: #dcfce7;
            color: #16a34a;
        }

        .status.listening {
            background: #dbeafe;
            color: #2563eb;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
        }

        .status.connected .status-dot,
        .status.listening .status-dot {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button.recording {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
            animation: recording-pulse 1s infinite;
        }

        @keyframes recording-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(239, 68, 68, 0.6);
            }
        }

        .mic-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
        }

        .text-input {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .text-input.active {
            display: flex;
        }

        .text-input textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            transition: border-color 0.3s ease;
        }

        .text-input textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .messages {
            margin-top: 30px;
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: 40px;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: white;
            color: #333;
            margin-right: 40px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.system {
            background: #fef3c7;
            color: #92400e;
            text-align: center;
            font-size: 12px;
        }

        .volume-indicator {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-top: 15px;
            height: 30px;
        }

        .volume-indicator.active {
            display: flex;
        }

        .volume-bar {
            width: 4px;
            height: 100%;
            background: #667eea;
            border-radius: 2px;
            animation: volume 0.5s infinite alternate;
        }

        .volume-bar:nth-child(1) { animation-delay: 0s; }
        .volume-bar:nth-child(2) { animation-delay: 0.1s; }
        .volume-bar:nth-child(3) { animation-delay: 0.2s; }
        .volume-bar:nth-child(4) { animation-delay: 0.3s; }
        .volume-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes volume {
            from { transform: scaleY(0.3); }
            to { transform: scaleY(1); }
        }

        .hint {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ 语音助手</h1>
        <p class="subtitle">FunASR + Qwen + Piper</p>

        <div class="status disconnected" id="status">
            <span class="status-dot"></span>
            <span id="status-text">未连接</span>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="voice">语音模式</button>
            <button class="mode-btn" data-mode="text">文字模式</button>
        </div>

        <div class="controls">
            <!-- 语音模式 -->
            <div id="voice-mode">
                <button class="mic-button" id="mic-btn" disabled>
                    🎤
                </button>
                <div class="volume-indicator" id="volume-indicator">
                    <div class="volume-bar"></div>
                    <div class="volume-bar"></div>
                    <div class="volume-bar"></div>
                    <div class="volume-bar"></div>
                    <div class="volume-bar"></div>
                </div>
            </div>

            <!-- 文字模式 -->
            <div class="text-input" id="text-mode">
                <textarea id="text-input-area" rows="4" placeholder="输入你的问题..."></textarea>
                <button class="send-btn" id="send-btn" disabled>发送</button>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <p class="hint" id="hint">点击按钮开始录音</p>
    </div>

    <!-- 音频播放 -->
    <audio id="audio-player"></audio>

    <script>
        // ============================================
        // 配置
        // ============================================

        const WS_URL = `ws://${window.location.host}/ws/text/${Math.random().toString(36).substr(2, 9)}`;

        // ============================================
        // 状态
        // ============================================

        let ws = null;
        let isRecording = false;
        let currentMode = 'voice';
        let mediaStream = null;
        let audioContext = null;
        let scriptProcessor = null;

        // ============================================
        // DOM 元素
        // ============================================

        const statusEl = document.getElementById('status');
        const statusTextEl = document.getElementById('status-text');
        const micBtn = document.getElementById('mic-btn');
        const volumeIndicator = document.getElementById('volume-indicator');
        const textModeEl = document.getElementById('text-mode');
        const voiceModeEl = document.getElementById('voice-mode');
        const textInputArea = document.getElementById('text-input-area');
        const sendBtn = document.getElementById('send-btn');
        const messagesEl = document.getElementById('messages');
        const hintEl = document.getElementById('hint');
        const audioPlayer = document.getElementById('audio-player');

        // ============================================
        // WebSocket 连接
        // ============================================

        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('WebSocket 已连接');
                updateStatus('connected', '已连接');
                micBtn.disabled = false;
                sendBtn.disabled = false;
                addMessage('system', '已连接到语音助手');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                console.log('WebSocket 已断开');
                updateStatus('disconnected', '未连接');
                micBtn.disabled = true;
                sendBtn.disabled = true;

                // 尝试重新连接
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
                updateStatus('disconnected', '连接错误');
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'connected':
                    addMessage('system', data.message);
                    break;

                case 'response':
                    addMessage('assistant', data.text);
                    break;

                case 'audio':
                    // 播放音频
                    const audioBlob = base64ToBlob(data.data, 'audio/wav');
                    audioPlayer.src = URL.createObjectURL(audioBlob);
                    audioPlayer.play();
                    break;

                case 'transcript':
                    addMessage('user', data.text);
                    break;

                case 'error':
                    addMessage('system', `错误: ${data.message}`);
                    break;
            }
        }

        function sendMessage(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(message));
            }
        }

        // ============================================
        // 状态更新
        // ============================================

        function updateStatus(status, text) {
            statusEl.className = `status ${status}`;
            statusTextEl.textContent = text;
        }

        // ============================================
        // 消息显示
        // ============================================

        function addMessage(role, text) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            msgEl.textContent = text;
            messagesEl.appendChild(msgEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ============================================
        // 模式切换
        // ============================================

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.mode;
                if (mode === currentMode) return;

                currentMode = mode;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                if (mode === 'voice') {
                    voiceModeEl.style.display = 'block';
                    textModeEl.classList.remove('active');
                    hintEl.textContent = '点击按钮开始录音';
                } else {
                    voiceModeEl.style.display = 'none';
                    textModeEl.classList.add('active');
                    hintEl.textContent = '输入文字后按发送';
                }
            });
        });

        // ============================================
        // 语音录制
        // ============================================

        micBtn.addEventListener('click', async () => {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        });

        async function startRecording() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });

                audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(mediaStream);

                // 使用 ScriptProcessor 获取原始音频数据
                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

                scriptProcessor.onaudioprocess = (e) => {
                    if (!isRecording) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcm16 = floatTo16BitPCM(inputData);

                    // 发送音频数据
                    sendMessage({
                        type: 'audio',
                        data: arrayBufferToBase64(pcm16.buffer),
                        sampleRate: 16000,
                    });

                    // 更新音量指示器
                    updateVolume(inputData);
                };

                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.innerHTML = '⏹️';
                volumeIndicator.classList.add('active');
                updateStatus('listening', '正在录音...');
                hintEl.textContent = '再次点击停止录音';

            } catch (error) {
                console.error('录音启动失败:', error);
                addMessage('system', `无法访问麦克风: ${error.message}`);
            }
        }

        function stopRecording() {
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.innerHTML = '🎤';
            volumeIndicator.classList.remove('active');
            updateStatus('connected', '已连接');
            hintEl.textContent = '点击按钮开始录音';
        }

        function updateVolume(audioData) {
            let sum = 0;
            for (let i = 0; i < audioData.length; i++) {
                sum += Math.abs(audioData[i]);
            }
            const avg = sum / audioData.length;
            const volume = Math.min(avg * 10, 1);

            document.querySelectorAll('.volume-bar').forEach((bar, i) => {
                const scale = 0.3 + volume * (1 + i * 0.2);
                bar.style.transform = `scaleY(${Math.min(scale, 1)})`;
            });
        }

        // ============================================
        // 文字输入
        // ============================================

        sendBtn.addEventListener('click', () => {
            const text = textInputArea.value.trim();
            if (!text) return;

            addMessage('user', text);
            sendMessage({
                type: 'text',
                content: text,
            });

            textInputArea.value = '';
        });

        textInputArea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        // ============================================
        // 工具函数
        // ============================================

        function floatTo16BitPCM(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return output;
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function base64ToBlob(base64, contentType) {
            const bytes = atob(base64);
            const array = new Uint8Array(bytes.length);
            for (let i = 0; i < bytes.length; i++) {
                array[i] = bytes.charCodeAt(i);
            }
            return new Blob([array], { type: contentType });
        }

        // ============================================
        // 初始化
        // ============================================

        connect();
    </script>
</body>
</html>
